model = "gpt-5.2"
model_reasoning_effort = "medium"
model_provider = "my-custom-proxy"
# The gpt-5.2 model catalog entry declares supports_search_tool = true, so
# Codex attaches the hosted web_search_preview tool to every turn unless told
# not to here. Azure (behind the LivAI proxy) rejects that tool with "Tool
# 'web_search_preview' disabled for this organization.", so it must be off.
# `web_search` is the actual switch (top-level enum: disabled|cached|indexed|
# live) that gates whether the tool gets attached to a request at all --
# `[tools] web_search` (kept below) is a separate, narrower flag and was not
# sufficient on its own.
web_search = "disabled"

[tools]
web_search = false
# Codex CLI project-scoped MCP config for dftracer-agents.
#
# Codex only loads this file for TRUSTED projects. That trust decision is
# deliberately not settable from here (a cloned repo must not be able to
# mark itself trusted) — add this yourself to your own ~/.codex/config.toml:
#
#   [projects."/abs/path/to/this/project"]
#   trust_level = "trusted"
#
# See docs/harnesses.rst for the full Codex CLI notes.

[mcp_servers.dftracer]
url = "http://127.0.0.1:5000/mcp"

[mcp_servers.dftracer.tools.memory_list]
approval_mode = "approve"

[mcp_servers.dftracer.tools.pipeline_get_run_id]
approval_mode = "approve"

[mcp_servers.dftracer.tools.session_status]
approval_mode = "approve"

[mcp_servers.dftracer.tools.session_validate_structure]
approval_mode = "approve"

[mcp_servers.dftracer.tools.validate_annotations]
approval_mode = "approve"

[mcp_servers.dftracer.tools.profile_bind]
approval_mode = "approve"

[mcp_servers.dftracer.tools.session_init_run]
approval_mode = "approve"

[mcp_servers.dftracer.tools.profile_step_begin]
approval_mode = "approve"

[mcp_servers.dftracer.tools.session_run_with_dftracer]
approval_mode = "approve"

[mcp_servers.dftracer.tools.split]
approval_mode = "approve"

[mcp_servers.dftracer.tools.view]
approval_mode = "approve"

[mcp_servers.dftracer.tools.session_analyze_traces]
approval_mode = "approve"

[mcp_servers.dftracer.tools.profile_step_end]
approval_mode = "approve"

[mcp_servers.dftracer.tools.memory_write]
approval_mode = "approve"

[projects."/usr/WS2/haridev/agent-tracer"]
trust_level = "trusted"

