# Harness-neutral permission policy — the single source of truth for the
# Permission Tiers table in CLAUDE.md (workspaces/ auto, project root edit
# with confirmation, outside the project root denied).
#
# Rendered per harness by src/dftracer_agents/permissions.py:
#   claude    -> .claude/settings.json  permissions.allow / permissions.deny
#                (deny always wins; unlisted paths fall through to Claude's
#                own default "ask" — so the project-root "ask" tier below is
#                a no-op for claude, not rendered as an explicit rule)
#   opencode  -> .opencode/opencode.jsonc top-level "permission" block
#                (glob map, evaluated in order, LAST MATCH WINS — list the
#                catch-all first, more specific overrides after)
#   copilot   -> not applicable; GitHub Copilot custom agents have no
#                path/command-scoped permission mechanism, only the
#                per-agent tools: allowlist agent_templates.py already
#                renders from each template's `tools:` list
#   codex     -> not settable from a repo-tracked file at all (Codex ignores
#                sandbox_mode/approval_policy in project-scoped config as an
#                anti-supply-chain-attack measure); render_codex sets a
#                fixed sandbox_mode="workspace-write" per agent instead, and
#                mcp_setup.configure_project_codex prints an advisory for
#                the trust_level the user must set in their OWN
#                ~/.codex/config.toml
#
# Edit this file, then run `dftracer-sync-permissions` (or the
# `permissions_sync` MCP tool) to re-render every harness's copy.

paths:
  - glob: "**"
    mode: ask
  - glob: "workspaces/**"
    mode: allow
  - glob: "src/dftracer_agents/.agents/skills/**"
    mode: allow

# Which tools take a filesystem PATH as their permission pattern, and how the
# `paths` tiers above are rendered onto each. Verified against OpenCode's own
# ask() call sites: read/edit ask with a worktree-relative path, so a path
# glob matches. glob/grep are deliberately absent — they ask with the *search*
# pattern ("**/*.py", "TODO"), never a path, so a path glob there would never
# match and would only look like coverage we do not have. list/write have no
# ask site of their own. Claude ignores this key (its dialect is Edit(...)/
# Write(...) actions, rendered from `paths` directly).
#
#   tiers       every entry, catch-all included — the full write policy
#   allow_only  just the `mode: allow` entries; anything unlisted falls
#               through to OpenCode's own default for that tool
path_scoped_tools:
  edit: tiers
  # allow_only, NOT tiers: OpenCode reads are allow-by-default (bar *.env), so
  # rendering the "**": ask catch-all here would make every read of this repo's
  # own source prompt. The workspace tier is about letting session work run
  # unattended, not about clamping down on reading.
  read: allow_only

# Outside the project root: never. Rendered as Write(...) deny entries for
# claude; opencode has no path outside the project's own tree to speak of
# under its edit tool, so this only affects claude's render.
deny_write_prefixes:
  - "/etc/*"
  - "/usr/*"
  - "/var/*"
  - "/tmp/*"
  - "/home/*"
  - "/root/*"

bash:
  deny:
    - "sudo *"
    - "sudo"
    - "rm -rf /*"
    - "rm -rf ~*"
    - "find /"
    - "find /etc*"
    - "find /var*"
    - "find /home*"
    - "find /root*"
    - "find /tmp*"
    - "find /opt*"
  allow:
    # Any command that operates on a session workspace — the Permission Tiers
    # table's "workspaces/<session>/ = Auto, run freely" tier. OpenCode matches
    # a bash rule against the whole command string (`*` -> `.*`, anchored), so
    # this covers `make -C workspaces/...`, `flux run ... workspaces/...`, and
    # the enumerated cases below alike. The deny list is rendered AFTER this
    # and last match wins, so `sudo ... workspaces/...` is still denied.
    #
    # Caveat, deliberately not papered over: a command whose cwd is inside the
    # session but whose text never says "workspaces/" cannot match this — bash
    # rules see the command, not the cwd. Those still prompt.
    - "* workspaces/*"
    - "git add src/dftracer_agents/.agents/skills/*"
    - "git commit *"
    - "ls workspaces/*"
    - "mkdir -p workspaces/*"
    - "cp * workspaces/*"
    - "mv * workspaces/*"
    - "find workspaces/*"
    - "cat workspaces/*"
    - "rm -rf workspaces/*"
    - "rm -rf $PROJECT_ROOT/workspaces/*"
    - "mv workspaces/* workspaces/*"

# "all_dftracer": every mcp__dftracer__<tool> the MCP server registers,
# discovered by permissions.py statically scanning mcp_tools/tools/**/*.py
# for @mcp.tool() defs rather than hand-maintained (which drifts).
#
# Rendered per harness, because the two dialects name MCP tools differently:
#   claude   -> the discovered `mcp__dftracer__<tool>` names, listed in
#               permissions.allow one by one
#   opencode -> a single `dftracer_*: allow` key. OpenCode's own tool id is
#               `sanitize(server) + "_" + sanitize(tool)` and it matches a
#               permission NAME with the same anchored wildcard matcher it
#               uses for patterns, so the glob covers every tool exactly.
#               NOTE: as of OpenCode 1.18.18 only builtin tools have ask()
#               call sites — MCP tool calls are not permission-gated at all,
#               so this key is a schema-valid statement of intent that has no
#               effect today. It costs nothing and starts working the moment
#               OpenCode adds a gate or we add a catch-all deny.
mcp_tools: all_dftracer
