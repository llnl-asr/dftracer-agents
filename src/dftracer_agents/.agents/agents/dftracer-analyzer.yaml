- title: Never report "no bottlenecks" from an empty diagnose()
  body: |
    If `diagnose()` returns 0 metric observations, that is a TOOL failure signal, not a
    result. Two of the previously-known causes of this were root-caused and fixed
    2026-07-20: (a) the `posix`/`dlio` presets silently produce 0-row flat views for
    apps whose `dft_event_logging` categories don't match their fixed layer-name list
    — use `analyzer_preset="generic"` (now the default); (b) the diagnose tool's own
    API path used to always no-op onto a naive pandas fallback because it checked for
    a method that an outdated `dfdiagnoser` release didn't have — the shared MCP venv
    now has a release with real `Diagnoser.diagnose_checkpoint` support. If you STILL
    get 0 observations after using the generic preset, the remaining known cause is
    `analyze()`'s run-to-run non-determinism described below.
    `analyze()` has been observed to be non-deterministic on identical inputs (e.g. Job Time
    14.35s / 265k events / 13 procs on one call vs 86.47s / 607k / 37 procs on the next, for a
    trace with a known 925,828 events and 64 pids). A checkpoint built from such a run carries
    no usable facts, so `diagnose()` scores nothing.

    Procedure:
    1. Cross-check every `analyze()` summary against `event_count` and the known pid count.
    2. If they disagree, rerun once and compare. If still inconsistent, fall back to direct
       per-event aggregation over the compact `.pfw.gz` chunks and SAY SO in the report,
       labelling which numbers came from tools and which from manual aggregation.
    3. Never let an empty `diagnose()` become "the workload has no bottlenecks."
- title: Rank by TIME, not by event count
  body: |
    Event counts mislead. A category can dominate the trace and cost nothing:
    e.g. STDIO 166,952 events but only 1.50s aggregate (~9us/op, ~11-byte writes), while POSIX
    670,158 events cost 65.5s. Always aggregate `dur` per category/op before ranking.
- title: Verify comp= labels via containment analysis, don't trust the function name
  body: |
    A `comp=` annotation tag reflects what the annotator GUESSED a function does from its
    name, not what a trace-level time breakdown actually shows. Confirmed on vpic-kokkos
    (2026-07-14): `dump_energies` was annotated `comp="io"` (its name suggests a dump/I/O
    routine) but interval-containment analysis (does the child span's [ts, ts+dur] fall
    inside the parent's?) showed 99.7% of its wall time was `MPI_Allreduce` — a
    communication routine, not I/O.

    For any FUNCTION-mode-annotated app, before recommending a fix for the category a
    `comp=` label implies, do a containment pass: for each top-level annotated function,
    sum the duration of its nested child spans grouped by their own category/name, and
    check which category actually dominates. Do this especially before recommending an
    I/O-side optimization — I/O-named functions are the most common mislabeling target
    since "dump"/"write"/"checkpoint" names get assigned `comp="io"` by the cost-filter
    heuristic regardless of what the function body actually spends time on.
