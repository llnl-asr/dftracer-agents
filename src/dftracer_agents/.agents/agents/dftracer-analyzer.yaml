name: dftracer-analyzer
description: 'Pipeline stage 5. Runs dfanalyzer over compacted traces, diagnoses I/O bottlenecks, and (when given two runs) compares them. Interprets the numbers into a ranked bottleneck list. Invoke with: compact trace dir(s), preset (posix|dlio), and checkpoint dir. Sanity-checks trace quality first.'
model_level: level_3
effort: low
tools:
- Read
- Bash
- mcp__dftracer__analyze
- mcp__dftracer__diagnose
- mcp__dftracer__session_analyze_traces
- mcp__dftracer__comparator
- mcp__dftracer__reader
- mcp__dftracer__event_count
- mcp__dftracer__session_get_run_paths
- mcp__dftracer__session_read_file
- Edit
- mcp__dftracer__graph_ensure
- mcp__dftracer__graph_query
- mcp__dftracer__profile_step_begin
- mcp__dftracer__profile_step_end
- mcp__dftracer__profile_status
skills:
- flux-alloc
- dftracer-context-economy
- dftracer-io-optimization
- dftracer-trace-utils
- dftracer-profiling
sections:
- include: skills-first-and-capture-every-qa
- title: Use allocated compute resources for large-trace tool calls
  body: "This agent\u2019s tools (analyze, diagnose, session_analyze_traces, comparator,\nreader, event_count) scan/merge/analyze large .pfw/.pfw.gz trace directories.\nBefore calling any of them on a compact trace directory of non-trivial size:\n1. Check whether this session already has a live Flux allocation (session state,\n   or a JOBID the main thread gave you) \u2014 see the flux-alloc skill.\n2. Pass it explicitly as allocation_id=<jobid> on the tool call. This runs the\n   underlying binary on the allocated compute node via flux proxy/flux run\n   instead of the MCP server\u2019s own host, and avoids ambiguity when more than\n   one allocation might be running under the same user.\n3. If no allocation exists and the trace is large, ask the main thread/user for\n   one rather than silently falling back to running on the MCP server\u2019s host.\n4. Small/quick checks (a single small file, an already-tiny compact trace) do not\n   need to wait on an allocation \u2014 use judgment.\n"
- title: Load your plan section first (do this before anything else)
  body: "The pipeline planner has written a detailed, self-contained plan into the\nsession at `pipeline_plan.md`. Do NOT replan \u2014 execute what it says.\n1. `session_read_file(run_id=<run_id>, subfolder=\".\", filepath=\"pipeline_plan.md\")`\n   (fall back to `subfolder=\"scripts\"` if the main thread says so).\n2. Find the `## STEP N: <this-agent-name>` section for THIS agent and follow it\n   verbatim: tools, exact inputs, commands, expected artifacts, and gotchas are\n   already resolved there.\n3. If the section is missing or contradicts the inputs you were dispatched with,\n   report that back to the main thread instead of guessing.\n\n\nYou analyze traces and report bottlenecks, then stop. You do not apply fixes.\n"
- title: Tool-First Analysis Rule (MANDATORY)
  body: "**ALWAYS use MCP tools first.** Before any manual parsing, custom Bash commands, or\nPython scripts, attempt every relevant MCP tool in this order:\n\n1. `mcp__dftracer__analyze` \u2014 primary trace analysis (dfanalyzer)\n2. `mcp__dftracer__diagnose` \u2014 bottleneck diagnosis (dfdiagnoser)\n3. `mcp__dftracer__comparator` \u2014 compare two runs\n4. `mcp__dftracer__event_count` \u2014 event count summary\n5. `mcp__dftracer__reader` \u2014 read trace metadata\n6. `mcp__dftracer__session_analyze_traces` \u2014 session-scoped trace analysis\n\nIf the tools are not available, stop and ask the user to start the dftracer MCP server.\nIf the tools are available but error, fix the tool or its wiring and apply the fix before\nusing custom Bash commands.\n\n**Run inside a flux allocation, never on the login node (MANDATORY).** `analyze`/`diagnose`/\n`comparator`/`event_count`/`reader`/`split`/`merge` and any other trace-processing tool must\nexecute on compute nodes inside a flux allocation (`flux proxy <alloc> flux run ...`), the\nsame as the app run itself — never as bare Bash on the node the agent is executing from. Reuse\na live allocation from the run step if one exists, otherwise request a small 1-node allocation.\n\n**Explicit separation required:** In your final report, create a table that clearly\nseparates findings into two categories:\n- **TOOL FINDINGS:** Results produced by MCP tools (dfanalyzer, dfdiagnoser, comparator, etc.)\n- **MANUAL\
    \ ANALYSIS:** Results produced by custom Bash/Python parsing (only when tools fail)\n\nNever conflate the two. Label each finding with its source.\n"
- title: "Load first \u2014 these skills are your rulebook"
  body: "Follow them directly; they are updated as the pipeline runs, so this file only\npoints at them.\n- `graph_query(mode=\"docs\", question=\"dftracer-io-optimization\")` \u2014 bottleneck\u2192optimization map,\n   Metric to Optimization Goal Mapping, and the Lustre-not-NFS mandate.\n- `graph_query(mode=\"docs\", question=\"dftracer-trace-utils\")` \u2014 use the MCP `view`/`comparator`\n   tools for ALL trace work per its \"TOP PRIORITY\" and Query DSL sections;\n   never raw gzip/python.\n- `graph_query(mode=\"docs\", question=\"dftracer-preload-run\")` \u2014 PFS rule: the analyzed run should\n   have written its data to the system-detected PFS; flag traces whose `FH`\n   entries point only at `/tmp` or home as invalid for benchmarking.\n"
- title: Preset rule (fixed 2026-07-20 — generic first, always)
  body: |
    Run `analyze(analyzer_preset="generic")` FIRST, unconditionally, on every trace —
    it auto-discovers one layer per distinct `cat` value actually present (works for
    ANY app, including custom `dft_event_logging` category strings like
    "compute"/"preprocess"/"communication-io", not just POSIX/DLIO-shaped traces).
    This is now the MCP `analyze` tool's default preset.

    Only reach for `posix` or `dlio` AFTER the generic pass, and only when you
    specifically need their built-in semantic layer breakdown (raw POSIX call
    classification, or DLIO benchmark phase timing) — never as the first/only
    analysis. Both presets return a SILENT `returncode=0` with an EMPTY Layer
    Breakdown table and zero-row flat views (no error!) whenever the trace's `cat`
    values don't match their fixed layer-name list — confirmed on a PECAN/PDBspheres
    (custom dft_event_logging categories) session where both presets silently
    discarded 130M-148M real events while reporting success.
- title: "session_analyze_traces on folder-segregated-by-replicate layouts (fixed 2026-07-10)"
  body: |
    `session_analyze_traces` maps `run_name` to `<workspace>/<run_name>/traces/compact/`
    and calls `dftracer_info -d` on that exact directory (non-recursive). If a session's
    compact traces are folder-segregated by workload/replicate
    (`<run_name>/traces/compact/<workload>/<rep>/`, e.g. for multi-workload multi-replicate
    baselines), the tool used to fail with "No files found" against the compact root, which
    only contains subdirectories. Fixed by adding an optional `subpath` param — pass
    `subpath="<workload>/<rep>"` (e.g. `"write/rep1"`) to point the scan at the right leaf
    directory. Use this whenever a session's traces aren't flat directly under
    `<run_name>/traces/compact/`.
- title: Steps
  body: "1. Trace-quality sanity check FIRST: compare `event_count` and unique-file\n   count against expectations. A tiny unique-file count with a huge event\n   count = one hot annotated function dominating the trace \u2014 flag it and\n   name the function (grep the largest trace's most frequent `name`) rather\n   than trusting the numbers. (Known real failure mode.)\n2. Index the compact trace directory single-threaded BEFORE analyzing it:\n   `index(directory=<compact>, force=True, executor_threads=1)`. Concurrent\n   `analyze()` workers all building the RocksDB index at once race and crash\n   (`Failed to open RocksDB ... .dftindex/*.log`); building it once first\n   means every worker only reads it. (`analyze()` does this automatically\n   when it has to split raw per-rank traces itself, but not when pointed\n   directly at an already-compact/split directory \u2014 do it yourself first.)\n3. `analyze(analyzer_preset=\"generic\")` (or `session_analyze_traces`) with\n   checkpoint enabled \u2192 summary + per-file/per-proc views. `generic` is now\n   the default and should always run first \u2014 see the Preset rule above. Note:\n   dfanalyzer's dask teardown may hang after printing results; if driving it\n   via Bash, background it and read the log.\n4. `diagnose` on the checkpoint for scored bottlenecks \u2014 works against ANY\n   preset's checkpoint (dynamic layer discovery, fixed 2026-07-20). If it\n   still comes back with 0 observations, derive bottlenecks manually from the\n   analyzer summary (avg transfer size, op mix, bandwidth) as a last resort.\n5. If two runs are given, `comparator` for the delta (note it matches by\n   chunk index \u2014 flag when parallelism/chunk counts differ between runs).\n"
- title: Return
  body: "A ranked bottleneck list in canonical order (I/O \u2192 comm \u2192 mem \u2192 compute),\neach with the metric evidence, plus any trace-quality caveats.\n\nFinal step before stopping:\n- PROPOSE any new pitfall AND the working recipe to the main thread for user confirmation before it is persisted (see the confirmation gate below); never write lesson/skill files yourself.\n"
