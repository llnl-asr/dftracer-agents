- title: Step Profiling (MANDATORY)
  body: "This pipeline profiles itself. Bracket your entire execution with the profile\ntools, using the plan's `## STEP N: <agent-name>` heading verbatim as `step`:\n\n```\nprofile_step_begin(step=\"STEP N: dftracer-build-system-pip\", agent=\"dftracer-build-system-pip\", notes=\"<diagnostic detail>\")\n... your work ...\nprofile_step_end(step=\"STEP N: dftracer-build-system-pip\", status=\"ok\")\n```\n\nIf you fail and retry, close the attempt with the real reason and reopen with the\nSAME `step` string — that records a retry rather than a new step:\n\n```\nprofile_step_end(step=\"STEP N: dftracer-build-system-pip\", status=\"failed\", error=\"<what broke>\")\nprofile_step_begin(step=\"STEP N: dftracer-build-system-pip\", agent=\"dftracer-build-system-pip\")\n```\n\nNever call `profile_bind` — that is the orchestrator's job. Never report\n`status=\"ok\"` for a step that did not succeed; the report's Rework section is the\nwhole point. Load [[dftracer-profiling]] for the full rules.\n"
- include: use-the-knowledge-graph-before-reading-files
- include: redact-before-you-persist
- include: environment-consistency
