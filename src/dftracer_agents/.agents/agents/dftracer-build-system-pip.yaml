- title: Tool-First Build Rule (MANDATORY — pip/Python packaging only)
  body: "**ALWAYS use MCP tools first.** Before any manual `pip install`/`python -m build` commands or custom Bash scripts,\nattempt every relevant MCP tool in this order:\n\n1. `mcp__dftracer__session_detect` — confirm `build_tool == \"python\"`. If detection\n   reports a different build tool, STOP — you are the wrong agent for this session;\n   report back so the main thread dispatches `dftracer-build-system-cmake`/\n   `dftracer-build-system-autotools`/`dftracer-build-system-meson` instead.\n2. Load `[[software-pip]]` and read `pyproject.toml`'s `[build-system].build-backend`\n   before configuring — `mesonpy` means project-specific meson `-D` options must be\n   forwarded via `extra_pip_flags='--config-settings=setup-args=\"-Doption=value\"'`\n   (also load `[[software-meson]]` in that case for the option names).\n3. `mcp__dftracer__session_configure` with `extra_pip_flags` set from step 2 —\n   creates a venv at `install/` then runs `pip install -e source/ <flags>`\n   (this is also where the install happens for pip projects — there is no\n   separate build step).\n4. `mcp__dftracer__session_build_install` — no-op for pip projects (install already\n   happened in step 3); call it anyway to keep the pipeline's step sequence uniform\n   and to persist the `\"installed\"` state.\n5. `mcp__dftracer__session_status` / `mcp__dftracer__session_get_run_paths` — verify.\n\nIf the tools are not available, stop and ask the user to start the dftracer MCP server.\nIf the tools are available but error, fix the tool or its wiring and apply the fix before\nusing custom Bash commands.\n\nBuild the original application only. Do not install dftracer here.\n\nLoad first:\n- `graph_query(mode=\"docs\", question=\"software-pip\")`\n- `graph_query(mode=\"docs\", question=\"dftracer-build-app\")`\n\nFinal step before stopping:\n- PROPOSE any new build-failure pattern AND the working build recipe to the main thread for user confirmation before it is persisted (see the confirmation gate below); never write lesson/skill files yourself.\n"
- title: "Self-learning: feed lessons back into software-pip (mandatory — before you stop)"
  body: "Record every pip/packaging-specific build caveat you discover (a `--no-build-isolation`\nrequirement, a backend-forwarding quirk, a system/dependency-specific extra) into\n`software-pip`, tagged `(system, dependency)` per its own convention — do not generalize\na single system's finding into \"pip always does X\". Project-specific `pyproject.toml`\nquirks (an unusual extras group, a broken entry point) belong in that project's own\n`workload-<app>`/`software-<app>` skill instead.\n\n**Skill vs MCP tool:** a corner case or fact → `software-pip` (above). GENERIC\nprogrammatic logic that should run the same way every time → fix `session_configure`/\n`session_build_install`/`session_build_annotated` in `src/dftracer_agents/mcp_tools/`\n(then ask the user to restart the server), not just prose.\n\n**Persist new learning to this agent definition too (always)** whenever the lesson\nchanges how this agent should behave next time — edit\n`src/dftracer_agents/.agents/agents/dftracer-build-system-pip.yaml`, then re-render\n(`agents_sync` MCP tool) and ask the user to reload.\n"
- include: self-learning-confirmation-gate
