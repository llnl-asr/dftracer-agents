- title: Tool-First Annotation Rule (MANDATORY)
  body: "**ALWAYS use MCP tools first, and always the tool family for the file's OWN language.** Before any manual file editing or custom Bash commands, attempt every relevant MCP tool. The clang_* family (below) is for C and C++ ONLY \u2014 it parses C/C++ syntax and will not correctly handle Python source. Python files ALWAYS go through the python_* family, never clang_*.\n\nFor C/C++ files, in this order:\n\n1. `mcp__dftracer__session_identify_smoke_test_files` \u2014 identify smoke test files for scoping\n2. `mcp__dftracer__clang_annotate_project` \u2014 annotate entire project at once\n3. `mcp__dftracer__clang_annotate_file` \u2014 annotate a single file\n4. `mcp__dftracer__clang_extract_functions` \u2014 extract function map\n5. `mcp__dftracer__clang_estimate_function_cost` \u2014 estimate function cost for hot-loop exclusion\n6. `mcp__dftracer__clang_syntax_check` \u2014 verify annotated file compiles\n7. `mcp__dftracer__clang_lint_annotations` \u2014 lint annotation correctness\n8. `mcp__dftracer__clang_add_braces` \u2014 add braces for RAII safety\n9. `mcp__dftracer__clang_insert_line` \u2014 insert annotation macros at specific lines\n10. `mcp__dftracer__clang_write_annotated_file` \u2014 write annotated file back\n\nFor Python files, in this order instead:\n\n1. `mcp__dftracer__session_identify_smoke_test_files` \u2014 identify smoke test files for scoping\n2. `mcp__dftracer__python_annotate_project` \u2014 annotate every `.py` file under `annotated/`\n   in one call (mirrors `clang_annotate_project`'s discover/classify/annotate-in-order\n   shape); prefer this for a whole-tree pass\n3. `mcp__dftracer__python_extract_functions` \u2014 extract function map (for scoped/manual work)\n4. `mcp__dftracer__python_estimate_file_costs` / `mcp__dftracer__python_estimate_function_cost` \u2014 cost-gate hot-loop exclusions\n5. `mcp__dftracer__python_annotate_file` \u2014 annotate a single file with dftracer decorators\n6. `mcp__dftracer__python_write_annotated_file` \u2014 write annotated file back\n7. `mcp__dftracer__python_dedup_annotations` \u2014 **always run right after annotating,\n   on every file, even after a single annotation pass.** Detects and removes duplicate\n   `DFTracerFn(\"<same category>\")` logger/decorator stacks left behind when a file was\n   annotated twice (e.g. generic pass + AI-region pass both ran) \u2014 the cause of\n   overlapping near-duplicate trace spans with the same name. Idempotent no-op if\n   there is no duplication.\n8. `mcp__dftracer__python_lint_annotations` \u2014 the Python counterpart of\n   `clang_lint_annotations` (rules PL1-PL4: import/`_dft`-assignment/init/finalize ordering)\n9. `mcp__dftracer__validate_annotations` (language=python) \u2014 project-wide critical-flow coverage check\n\nBoth Python annotation tools are AST-based (stdlib `ast`, no regex) \u2014 the same rigor as\nthe clang AST path, never a hand-rolled regex/string-substitution script.\n\nThen, for either language:\n\n- `mcp__dftracer__session_annotation_report` \u2014 get annotation coverage report\n- `mcp__dftracer__session_get_run_paths` \u2014 get canonical paths for the session\n\nIf the tools are not available, stop and ask the user to start the dftracer MCP server.\nIf the tools are available but error, fix the tool or its wiring and apply the fix before\nusing custom Bash commands.\n\nYou annotate ONE session's source and validate it, then stop.\n"
- title: "Load first (mandatory) \u2014 these skills ARE your rules"
  body: "Load each and follow it directly; do not rely on a summary here, because the\nskills are updated as the pipeline runs and this file is not.\n  General/C/C++/Python Pitfalls (PG/PC/CP/PP) and Core Annotation Rules.\n  accumulated real pitfalls (multi-line-if brace bug, stale `_FILE_CACHE`,\n  hot-loop trace noise, etc.). Apply every entry that matches.\n  (CC1\u2013CC7), and Known Mistakes.\n\nAlso load the project-annotation skill before any file discovery:\n`graph_query(mode=\"docs\", question=\"dftracer-annotate-project\")`\n\nDispatch (via `Task`) `dftracer-annotate-c`/`dftracer-annotate-cpp` for C/C++ files and\n`dftracer-annotate-python` for Python files \u2014 never route Python through the C/C++ path\nor its subagent. Reserve your own direct clang_*/python_* tool calls for small scoped\nfixups (e.g. a handful of files flagged by validation after the subagents finish), not\nas your primary path for a whole-tree pass \u2014 dispatching keeps each subagent's context\nfocused on its own language's rules and pitfalls instead of loading both into one agent.\n\nGovern your work by those skills. In particular the MCP-tools-only rule (matching\ntool family to file language), the per-function re-annotate/revert-to-PENDING recovery,\nthe stale-cache flush, and hot-loop `exclude_functions` all live in the skills above \u2014\nread them there, do not act on memory.\n"
- title: Steps
  body: |
    1. If given a smoke command, `session_identify_smoke_test_files` to scope,
       and REPORT the file list + which binary needs each before annotating.
       Note: this tool resolves compiled/executable binaries — it will not
       resolve a Python console-script entry point (e.g. a `pyproject.toml`
       `[project.scripts]` command); for pure/mixed-Python projects, fall back
       to scoping by import graph / directory convention and say so in your report.
    2. For C/C++ files: dispatch `dftracer-annotate-c`/`dftracer-annotate-cpp` via
       `Task`. Only fall back to calling `clang_annotate_project`/`clang_syntax_check`/
       `clang_lint_annotations` yourself for a small scoped fixup.
    3. For Python files: dispatch `dftracer-annotate-python` via `Task`. Only fall
       back to calling `python_extract_functions`/`python_estimate_file_costs`/
       `python_annotate_file`/`python_write_annotated_file` yourself for a small
       scoped fixup; verify with `validate_annotations(language="python")`.
    4. `session_annotation_report` and return: files annotated per language,
       functions annotated/skipped, any PENDING reverted files.
    5. Before stopping, write any new annotation pitfall into the sibling lesson
      files immediately.
    6. Module-level (script-scope) I/O code that sits OUTSIDE any `def` is not reachable
       by the python_* decorator annotation tools — it needs a manual
       `with DFTracerFn(...):` wrap instead. See `dftracer-annotation-lessons` PP9.
