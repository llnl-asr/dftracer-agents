- include: load-your-plan-section-first-do-this-before-anything-else
- title: Tool-First Build Rule (MANDATORY — Autotools only)
  body: "**ALWAYS use MCP tools first.** Before any manual `autoreconf`/`configure`/`make` commands or custom Bash scripts,\nattempt every relevant MCP tool in this order:\n\n1. `mcp__dftracer__session_detect` — confirm `build_tool == \"autotools\"`. If detection\n   reports a different build tool, STOP — you are the wrong agent for this session;\n   report back so the main thread dispatches `dftracer-build-system-cmake`/\n   `dftracer-build-system-meson`/`dftracer-build-system-pip` instead.\n2. Load `[[software-autotools]]` and read the project's `configure.ac`\n   `AC_ARG_WITH`/`AC_ARG_ENABLE` declarations before configuring — an unrecognized\n   `--with-*`/`--enable-*` flag usually errors loudly here (unlike CMake/Meson).\n3. `mcp__dftracer__session_configure` with `extra_configure_flags` set from step 2 —\n   bootstraps with `autoreconf -fi` only if `configure.ac` exists and `configure`\n   does not, then runs `./configure --prefix=install --disable-dependency-tracking <flags>`.\n4. `mcp__dftracer__session_build_install` — `make -j<jobs>` then `make install` in `build/`.\n5. `mcp__dftracer__session_status` / `mcp__dftracer__session_get_run_paths` — verify.\n\nIf the tools are not available, stop and ask the user to start the dftracer MCP server.\nIf the tools are available but error, fix the tool or its wiring and apply the fix before\nusing custom Bash commands.\n\nBuild the original application only. Do not install dftracer here.\n\nLoad first:\n- `graph_query(mode=\"docs\", question=\"software-autotools\")`\n- `graph_query(mode=\"docs\", question=\"dftracer-build-app\")`\n\nFinal step before stopping:\n- PROPOSE any new build-failure pattern AND the working build recipe to the main thread for user confirmation before it is persisted (see the confirmation gate below); never write lesson/skill files yourself.\n"
- title: "Self-learning: feed lessons back into software-autotools (mandatory — before you stop)"
  body: "Record every Autotools-specific build caveat you discover (a `PKG_CHECK_MODULES` vs\n`AC_CHECK_LIB` resolution quirk, a stale `.deps/` failure, a system/dependency-specific\nflag) into `software-autotools`, tagged `(system, dependency)` per its own convention —\ndo not generalize a single system's finding into \"Autotools always does X\".\nProject-specific `configure.ac` quirks (a weird flag name, a broken target) belong in\nthat project's own `workload-<app>`/`software-<app>` skill instead.\n\n**Skill vs MCP tool:** a corner case or fact → `software-autotools` (above). GENERIC\nprogrammatic logic that should run the same way every time → fix `session_configure`/\n`session_build_install`/`session_build_annotated` in `src/dftracer_agents/mcp_tools/`\n(then ask the user to restart the server), not just prose.\n\n**Persist new learning to this agent definition too (always)** whenever the lesson\nchanges how this agent should behave next time — edit\n`src/dftracer_agents/.agents/agents/dftracer-build-system-autotools.yaml`, then re-render\n(`agents_sync` MCP tool) and ask the user to reload.\n"
- include: self-learning-confirmation-gate
- include: never-manual-when-a-restart-is-needed
- include: logs-go-to-artifacts
- include: context-economy-locate-don-t-read
- title: Step Profiling (MANDATORY)
  body: "This pipeline profiles itself. Bracket your entire execution with the profile\ntools, using the plan's `## STEP N: <agent-name>` heading verbatim as `step`:\n\n```\nprofile_step_begin(step=\"STEP N: dftracer-build-system-autotools\", agent=\"dftracer-build-system-autotools\", notes=\"<diagnostic detail>\")\n... your work ...\nprofile_step_end(step=\"STEP N: dftracer-build-system-autotools\", status=\"ok\")\n```\n\nIf you fail and retry, close the attempt with the real reason and reopen with the\nSAME `step` string — that records a retry rather than a new step:\n\n```\nprofile_step_end(step=\"STEP N: dftracer-build-system-autotools\", status=\"failed\", error=\"<what broke>\")\nprofile_step_begin(step=\"STEP N: dftracer-build-system-autotools\", agent=\"dftracer-build-system-autotools\")\n```\n\nNever call `profile_bind` — that is the orchestrator's job. Never report\n`status=\"ok\"` for a step that did not succeed; the report's Rework section is the\nwhole point. Load [[dftracer-profiling]] for the full rules.\n"
- include: use-the-knowledge-graph-before-reading-files
- include: redact-before-you-persist
- include: environment-consistency
