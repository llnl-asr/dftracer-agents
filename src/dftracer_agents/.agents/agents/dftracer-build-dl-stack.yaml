- title: Step Profiling (MANDATORY)
  body: |
    Bracket your entire execution with the profile tools, using the plan's
    `## STEP N: <agent-name>` heading verbatim as `step`:

    ```
    profile_step_begin(step="STEP N: dftracer-build-dl-stack", agent="dftracer-build-dl-stack", notes="<detail>")
    ... your work ...
    profile_step_end(step="STEP N: dftracer-build-dl-stack", status="ok")
    ```

    On failure+retry, close with the real reason and reopen with the SAME `step` string so it
    records a retry rather than a new step. Never call `profile_bind` (orchestrator's job) and
    never report `status="ok"` for a step that did not succeed. Load [[dftracer-profiling]].
