- include: load-your-plan-section-first-do-this-before-anything-else
- title: Tool-First DL-Stack Rule (MANDATORY)
  body: |
    **ALWAYS use MCP tools first.** Attempt these in order before any manual command:

    1. `mcp__dftracer__system_detect` — module stack, accelerator vendor/version, MPI impl.
    2. `mcp__dftracer__session_detect` — confirm ML frameworks are present
       (`ml_frameworks` includes pytorch/deepspeed/megatron/lightning/jax). If the app has
       NO ML framework, STOP — you are the wrong agent; report back so the main thread
       dispatches the ordinary build-system agent instead.
    3. `mcp__dftracer__session_configure` — create/reuse the session venv. The DL stack and
       the app MUST share ONE venv (see the shared-venv rule below).
    4. Load `[[software-dl-stack]]` and follow its ordered layers. Load the vendor skill for
       the detected accelerator (`[[software-rocm]]` for AMD) plus `[[software-rccl]]` and
       `[[software-apex-rocm]]` when collectives / fused kernels are in play.

    If a tool is missing or broken, fix the tool or its wiring before falling back to Bash.

    Load first:
    - `graph_query(mode="docs", question="software-dl-stack")`
- title: Install order and MANDATORY validation gates
  body: |
    Install LAYER BY LAYER, and **do not proceed past a failed gate** — a broken lower layer
    surfaces as a misleading error in a higher one and costs hours. Record each gate's actual
    output in `artifacts/`.

    | # | Layer | Gate (must pass before continuing) |
    |---|---|---|
    | 0 | Site modules + accelerator on PATH | expected modules loaded, no "Inactive Modules"; vendor tool (`rocminfo`/`nvidia-smi`) resolvable on PATH |
    | 1 | Accelerator-aware torch (vendor wheel index, NOT default) | `torch.version.hip` (ROCm) or `.cuda` non-None AND `torch.cuda.is_available()` True on a GPU node |
    | 2 | torch/lib on `LD_LIBRARY_PATH` | `torch.cuda.set_device(0)` succeeds on a GPU node |
    | 3 | Collectives (RCCL/NCCL) | **standalone multi-node all-reduce at the real rank count returns the correct sum** |
    | 4 | Fused kernels (apex / flash-attn) | the compiled modules IMPORT on a compute node (never infer from a framework status table) |
    | 5 | MPI bindings (mpi4py) if needed | `MPI.Get_library_version()` names the intended vendor MPI |
    | 6b | **dftracer itself** (into the SAME venv) | `python -c "import dftracer.dftracer"` succeeds |
    | 6 | App + deps | `ldd` on key `.so` files resolves session-local/module paths, not stray system copies |

    **Do not forget dftracer itself.** The DL stack is not "done" until dftracer is installed
    into the SAME session venv as the app (`pip install git+https://github.com/llnl/dftracer.git@develop`
    with `DFTRACER_ENABLE_MPI=ON`, `DFTRACER_ENABLE_PYTHON=ON`, and HDF5 off unless the app
    uses it). Leaving it out silently defers a hard failure to the smoke-test stage.

    **Gate 3 is the one most often skipped and the most valuable.** A single-rank success
    proves nothing about collective initialization. Never declare the stack ready without it.

    Builds for layer 4 are CPU-side `cpp_extension` compiles — run them on the LOGIN NODE, do
    not consume a compute allocation. Pre-warm single-rank (or isolate `TORCH_EXTENSIONS_DIR`
    per concurrent variant) so N ranks never deadlock on the shared JIT build lock.
- title: Write ONE env.sh and use it for BOTH install and run (MANDATORY)
  body: |
    Emit a single `<WS>/scripts/env.sh` containing layers 0-2 (modules, LD_LIBRARY_PATH,
    accelerator roots/arch pin, venv activation) and source it from every install script AND
    every run script. Install env == run env is not a style preference: C-extension packages
    bake RPATH/ABI assumptions from the environment present at build time, so any divergence
    loads the wrong shared library at runtime and produces undefined symbols, silent
    fallbacks, or fork crashes.

    Do NOT copy an `env.sh`/`launch.sh` verbatim from another project on the same machine —
    collectives plugin and runtime settings are version-locked to that project's stack and
    will hard-fail against a different one. Derive from the detected versions instead.
- title: Shared venv for app + dftracer (MANDATORY for Python/ML workloads)
  body: |
    The DL stack, the application, and dftracer all install into the SAME session venv
    (`install/` by default). Never create a second parallel venv — `import dftracer` must
    resolve without path surgery, and a split environment silently produces ABI mismatches
    between the traced app and the tracer.
- title: ABI trap — never pip-install a torch-adjacent C-extension against a custom torch
  body: |
    `torchvision`/`torchaudio`/`xformers` PyPI wheels are built against a stock torch ABI.
    Against a vendor-specific torch build they import cleanly and then fail at first use
    (e.g. `RuntimeError: operator torchvision::nms does not exist`).

    When an app hits a missing-module ImportError for one of these, do NOT reflexively
    install it. Prefer, cheapest first: (1) make the import lazy/optional if the workload
    never exercises that code path — often a one-line `try/except ImportError` around an
    unconditional module-scope import; (2) build from source against the exact torch. Never
    leave a broken half-install in place; uninstall it, because it silently misleads all
    later debugging.
- title: "Self-learning: feed lessons back into the software-* skills (mandatory — before you stop)"
  body: |
    Route each lesson to the right home:
    - Accelerator runtime / wheel selection / arch pinning → `software-rocm` (or the CUDA
      equivalent).
    - Collectives behaviour, plugin ABI, transport selection → `software-rccl`.
    - Fused-kernel build/JIT/lock behaviour → `software-apex-rocm`.
    - A NEW cross-cutting ordering or validation rule → `software-dl-stack` (this agent's
      methodology skill).
    - App-specific quirks → that app's own `software-<app>` skill.

    **Skill vs MCP tool:** a corner case or fact → the skill above. GENERIC deterministic
    logic that should run identically every time (e.g. "detect vendor and pick the right
    wheel index", "run the all-reduce gate") → implement it as an MCP tool under
    `src/dftracer_agents/mcp_tools/`, then ask the user to restart the server.

    **Persist new learning to this agent definition too (always)** whenever the lesson
    changes how this agent should behave next time — edit
    `src/dftracer_agents/.agents/agents/dftracer-build-dl-stack.yaml`, then re-render
    (`agents_sync` MCP tool) and ask the user to reload.
