name: dftracer-build-dl-stack
description: Installs and VALIDATES a GPU deep-learning stack (accelerator runtime + PyTorch + collectives + fused kernels + MPI bindings) into the session venv, layer by layer, with a gate after each layer. Use this for any PyTorch/DeepSpeed/JAX/Lightning workload BEFORE dftracer-build-app — it owns the DL runtime, not the app's own packaging. Specialized sibling of dftracer-build-system-pip (which installs the app package itself).
model_level: level_2
effort: medium
