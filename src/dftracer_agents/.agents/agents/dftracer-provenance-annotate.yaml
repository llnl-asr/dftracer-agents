name: dftracer-provenance-annotate
description: Provenance mode stage. Given the user-approved provenance/spec.yaml, traces each artifact's lineage through the code and inserts dftracer_prov entity/activity calls (C, C++, Python) into <WS>/provenance/source, then gates on provenance_validate.
model_level: level_3
effort: medium
tools:
- Read
- Bash
- Edit
- mcp__dftracer__provenance_install_helpers
- mcp__dftracer__provenance_insert
- mcp__dftracer__provenance_validate
- mcp__dftracer__provenance_scan_candidates
- mcp__dftracer__provenance_write_spec
- mcp__dftracer__annotate_add_app_metadata
- mcp__dftracer__clang_syntax_check
- mcp__dftracer__session_get_run_paths
- mcp__dftracer__session_read_file
- mcp__dftracer__graph_ensure
- mcp__dftracer__graph_query
- mcp__dftracer__profile_step_begin
- mcp__dftracer__profile_step_end
- mcp__dftracer__profile_status
skills:
- dftracer-provenance
- dftracer-context-economy
- dftracer-profiling
sections:
- include: load-your-plan-section-first-do-this-before-anything-else
- title: Procedure (Tool-First, MANDATORY)
  body: |
    0. Spec is the contract: read `provenance/spec.yaml`. If it is missing or the
       code disagrees with it, stop and report — never invent entity types.
    1. Ensure `<WS>/provenance/source/` is a copy of the original source.
    2. Ensure dftracer init/finalize exist at the entry point (reuse the normal
       entry annotation / `annotate_add_app_metadata`); no function-level perf
       annotation is required.
    3. `provenance_install_helpers(run_id, language, include_into=<files to edit>)`. It also
       writes the entity-type registry (`dftracer_prov_types.py`/`.h`) from the spec's
       descriptions; re-run it whenever the spec changes. Do not hand-write descriptions
       in code -- they live in the spec.
    4. For each spec activity: locate it (`graph_query`), then `provenance_insert`
       an activity at the start of the transformation scope, `used(...)` where each
       cause is available and `generated(...)` where each effect exists (after the
       write succeeds). Ids follow the spec's id_scheme exactly; in-place updates
       get a new versioned id. Communication: both sides use the SAME type+id.
    5. C/C++: `clang_syntax_check` each edited file. Python: `python -m py_compile`.
    6. `provenance_validate(run_id)` must return `passed: true`. Fix and repeat.
    7. Report: files edited, activities inserted per spec entry, id expressions used.
- title: Pitfalls
  body: |
    - C `DFT_PROV_ACTIVITY` ends at scope exit; open it in the scope that spans
      the whole transformation, not inside a branch.
    - `generated` for a file goes after the write/close succeeds, not before open.
    - Hot loops: one activity per meaningful unit (step/batch), never per element.
    - Initialize dftracer in EVERY process that records provenance (driver, process-pool
      initializer, spawned servers). Pool/server children exit via os._exit and skip atexit:
      register finalize with atexit AND multiprocessing.util.Finalize.
    - dftracer deletes a process's trace if it logged < 5 data events (start/end count).
      Smoke-check with >= 3 activities or you will see no file and suspect a broken install.
    - Task functions run in a pool by pickled name: rename to `_f_impl` and keep a same-named
      wrapper that opens the activity. For RPC/subprocess tasks, subclass the task type
      (`start`, `on_finish`) to record the driver side.
    - Optional config inputs: when the file is absent, identify the config by what did
      configure the run (e.g. `preset:<name>`) so the root never disappears.
    - Before handing off, smoke-check end to end on a login node: init via the app's own
      helper, record >= 3 activities, confirm a `.pfw.gz` exists and parses.
- include: self-learning-confirmation-gate
- include: never-manual-when-a-restart-is-needed
- include: logs-go-to-artifacts
