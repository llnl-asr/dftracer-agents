stages: [alloc, test, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dftracer-agents-ci
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

# Shared allocation; test + docs both run on it via flux proxy.
test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    # flux run -N 1 executes the script ON the allocated node; the script runs
    # everything in podman containers (python:3.11, like the docs/test env).
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/test-docs.sh
  artifacts:
    paths: [public]

# Publishes the artifact from test — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [test]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by test"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # Runs last: alloc → test → pages → deallocate.
  needs: [allocate, test, {job: pages, optional: true}]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
